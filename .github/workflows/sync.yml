name: Sync Xiaomi workouts

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          XIAOMI_USERNAME: ${{ secrets.XIAOMI_USERNAME }}
          XIAOMI_PASSWORD: ${{ secrets.XIAOMI_PASSWORD }}
          WORKOUT_TOKEN: ${{ secrets.WORKOUT_TOKEN }}
        run: |
          missing=0
          if [ -z "$XIAOMI_USERNAME" ]; then echo "Missing secret: XIAOMI_USERNAME"; missing=1; fi
          if [ -z "$XIAOMI_PASSWORD" ]; then echo "Missing secret: XIAOMI_PASSWORD"; missing=1; fi
          if [ -z "$WORKOUT_TOKEN" ]; then echo "Missing secret: WORKOUT_TOKEN"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test parser
        run: npm test

      - name: Fetch GPX workouts from Xiaomi Fitness
        env:
          XIAOMI_USERNAME: ${{ secrets.XIAOMI_USERNAME }}
          XIAOMI_PASSWORD: ${{ secrets.XIAOMI_PASSWORD }}
          XIAOMI_REGION: ${{ secrets.XIAOMI_REGION }}
          XIAOMI_TIMEZONE: ${{ secrets.XIAOMI_TIMEZONE }}
          XIAOMI_DEVICE_ID: ${{ secrets.XIAOMI_DEVICE_ID }}
        run: node src/cli.js --out ./out

      - name: Publish GPX files to workout repository
        env:
          WORKOUT_TOKEN: ${{ secrets.WORKOUT_TOKEN }}
          WORKOUT_REPO: ${{ secrets.WORKOUT_REPO }}
        run: |
          set -euo pipefail
          repo="${WORKOUT_REPO:-${GITHUB_REPOSITORY_OWNER}/workout}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${WORKOUT_TOKEN}@github.com/${repo}.git" workout-repo
          shopt -s nullglob
          copied=0
          for file in out/*.gpx; do
            cp "$file" "workout-repo/$(basename "$file")"
            copied=$((copied + 1))
          done
          if [ "$copied" -eq 0 ]; then
            echo "No GPX files to publish"
            exit 0
          fi
          git -C workout-repo add -- '*.gpx'
          if git -C workout-repo diff --cached --quiet; then
            echo "No workout changes"
            exit 0
          fi
          git -C workout-repo commit -m "Sync Xiaomi Fitness GPX workouts"
          git -C workout-repo push
